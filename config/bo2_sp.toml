# XenonRecomp config for the Black Ops 2 campaign executable.
# Paths are relative to this file. Everything under ../private and ../ppc is
# local only and ignored by git.

[main]
file_path = "../private/default.xex"
patch_file_path = "../private/default.xexp"
patched_file_path = "../private/default_patched.xex"
out_directory_path = "../ppc"
switch_table_file_path = "bo2_sp_switch_tables.toml"

# Leave optimizations off until the recompiled game boots.
skip_lr = false
skip_msr = false
ctr_as_local = false
xer_as_local = false
reserved_as_local = false
cr_as_local = false
non_argument_as_local = false
non_volatile_as_local = false

# Register save/restore helpers and setjmp/longjmp for title update v18, found
# by `bo2scan`. Each helper pattern matched exactly once, and setjmp/longjmp
# were confirmed in the disassembly.
restgprlr_14_address = 0x826E9310
savegprlr_14_address = 0x826E92C0
restfpr_14_address = 0x826E93BC
savefpr_14_address = 0x826E9370
restvmx_14_address = 0x826EB908
savevmx_14_address = 0x826EB670
restvmx_64_address = 0x826EB99C
savevmx_64_address = 0x826EB704

setjmp_address = 0x826EC320
longjmp_address = 0x826EC7B0

# Functions that contain jump tables but have no .pdata entry (from `bo2scan`).
# XenonRecomp's analyser would otherwise end them at the bctr.
functions = [
    { address = 0x8210D2E8, size = 0xA8 },
